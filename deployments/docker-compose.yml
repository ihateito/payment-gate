services:
  # ============================================================================
  # CORE INFRASTRUCTURE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: payment_postgres
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # APPLICATION MICROSERVICES
  # ============================================================================
  api-gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE: api-gateway
    container_name: payment_api_gateway
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json
      GATEWAY_HTTP_PORT: 8080
      DATABASE_URL: postgres://payment_user:payment_pass@postgres:5432/payment_gateway?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPIC_PAYMENT_EVENTS: payment.events.v1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox-worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE: outbox-worker
    container_name: payment_outbox_worker
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json
      DATABASE_URL: postgres://payment_user:payment_pass@postgres:5432/payment_gateway?sslmode=disable
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPIC_PAYMENT_EVENTS: payment.events.v1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # OPTIONAL OBSERVABILITY & EVENT BUS (PROFILES: full)
  # Run with: docker compose --profile full up -d
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: payment_redpanda
    profiles:
      - full
      - kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: payment_redpanda_console
    profiles:
      - full
      - kafka
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: payment_jaeger
    profiles:
      - full
      - telemetry
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: payment_prometheus
    profiles:
      - full
      - telemetry
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
